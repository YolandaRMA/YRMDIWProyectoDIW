<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El color</title>
    <style>
       body{
           margin: 5px;
           font-family: sans-serif;
           font-weight: bold;
        }
        *{
            box-sizing: border-box;
        }
        table{
            width: 100%;
            table-layout: fixed;
        }
        table:nth-of-type(1){
            & td:nth-child(1){background-color: red;}
            
        }
         table:nth-of-type(1){
            & td:nth-child(2){background-color: #00ff00;}         
        }
          table:nth-of-type(1){
            & td:nth-child(3){background-color:  #0000FF}         
        }
       
        
    </style>
</head>

<body>
    <header>
        <h1>Trabajando con colores</h1>
    </header>
    <table>
        <caption>Colores primarios</caption>
        <tr>
            <td>#FF0000</td>
            <td>#00FF00</td>
            <td>#0000FF</td>
        </tr>
    </table>
    <table>
        <caption>Colores Secundarios</caption>
        <tr>
            <td>#FFFF00</td>
            <td>#FF0000</td>
            <td>#FF00FF</td>
            <td>#0000FF</td>
            <td>#00FFFF</td>
            <td>#00FF00</td>
        </tr>
    </table>
</body>

</html>
