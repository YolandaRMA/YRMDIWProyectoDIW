<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pestañas</title>
    <style>
        * {
       box-sizing: border-box;
       font-family: sans-serif;
      
      }
      body{
        margin: 5px;
      }
      .container{
        position: relative;
       
      }
      a{
        display: inline-block;
        text-align: center;
        line-height: 40px;
        width: 96px;
        height: 40px;
        text-decoration: none;
        border-radius: 6px 6px 0px 0px;
        letter-spacing: 2px;
        font-family: Impact, sans-serif;
        margin: 0px 24px;
        &:nth-of-type(1){background-color: #67e767;}
        &:nth-of-type(2){background-color: #5178e4;}
        &:nth-of-type(3){background-color: #ebb7d9;}
      }
      article{
        position: absolute;
        width: 550px;
        height: 300px;
        padding: 10px;
        font-weight: bold;
        
        
        &:nth-of-type(1){background-color: #67e767;z-index: 1;}
        
        &:nth-of-type(2){background-color: #5178e4;z-index: 1;}
        &:nth-of-type(3){background-color: #ebb7d9;z-index: 1;}

        article:target{z-index: 100;       }
      }
    </style>
</head>
<body>
    <div class="container">
         <!-- a[href=#p$]{$}*3+article[id=p$]{Este es el contenido de la $ pestaña}*3 -->
          <a href="#p1">primera</a>
          <a href="#p2">segunda</a>
          <a href="#p3">tercera</a>

          <article id="p1">Este es el contenido de la 1 pestaña</article>
          <article id="p2">Este es el contenido de la 2 pestaña</article>
          <article id="p3">Este es el contenido de la 3 pestaña</article>
    </div>
</body>
</html>
