<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2-7-2</title>
        <style>
      * {
       box-sizing: border-box;   
       margin: 0;
       font-family: sans-serif;
      }
      body{
        margin: 5px;
      }
     .wrapper{
      margin: auto;
      width: 600px;
      height: 600px;
      background:#eee ;
      position: relative;
      overflow: hidden;

     }
     input{display: none;}
#mm{
  display: block;
  width: max-content;
  text-transform: uppercase;
  font-weight: bold;
  font-size: 1.3rem;
  background: #008080;
  border-radius: 6px;
  color: white;
  padding: 10px;
}
article{
  width: 100%;
  height: 100%;
  position: absolute;
  top: 40px;
  background: #226546cd;
  left: -100%;
  transition: all 0.5s ease-in-out ;
  & label{
    position: absolute;
    display: inline-block;
    width: 48px;
    right: 10px;
    top: 10px;
    height: 48px;
    background: orangered;
    text-align: center;
    line-height: 48px;
    font-size: 1.5rem;
    border-radius: 50%;
    font-weight: bold;
    color: white;
    right: 10px;

  }
  & p{
    width: 80%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
}
#rdOpen:checked ~article{
  left: 0;
  
}
    </style>
</head>
<body>
 <div class="wrapper">
  <h2>Ventana modal con :checked y radio buttons</h2>
  <input type="radio" name="rd" id="rdOpen">
  <label for="rdOpen" id="mm">Mostrar modal</label>
  <input type="radio" name="rd" id="rdClose">
  <article>
    <label for="rdClose" id="close">X</label>
    <p>
      Lorem ipsum dolor sit, amet consectetur adipisicing elit. 
      Sequi animi neque qui asperiores molestias recusandae, 
      repellat nobis in facere molestiae inventore possimus 
      explicabo officia consequatur, ullam, cum harum 
      exercitationem error.
    </p>
  </article>
 </div>
</body>
</html>
