<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pr-2-7-4</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: white;
}
header {
  width: 100%;
  height: 22px;
  background: #3769a6;
  color: white;
}

header h1 {
  font-size: 14px;
  padding-left: 8px;
}
h2 {
  font-size: 24px;
  margin: 8px;
}
.container {
 display: block;
  width: 600px;
  height: 500px;
  padding-top: 50px;
  padding-left: 13px;
  background: rgba(106,81.51.0.851);
}

.circulo {
  position: relative; /*padre necesita position: relative.*/
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: blue;
  isolation: isolate; /*isolation: isolate permite controlar correctamente las capas con z-index.*/
}

/*Los pseudoelementos utilizan position: absolute para colocarse respecto a la esfera.*/
/* color degradado  */
.circulo::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  border-radius: 50%;
  background: radial-gradient( /*Cubre toda la esfera y genera la transición de amarillo a azul mediante radial-gradient().*/
    circle at 25% 20%,
    yellow,
    #baba4b 30%,
    #6666a0 58%,
    blue
  );

  z-index: 1;
}

/* sombre bajo esfera */
.circulo::after {
  content: "";
  position: absolute;
  width: 145px;
  height: 18px;
  left: 65px;
  bottom: -12px;
  border-radius: 50%;
  background: blue;
  filter: blur(5px); /*Crea una elipse azul debajo de la esfera. filter: blur(5px) difumina sus bordes.*/
  z-index: -1;
}

.wrapper{
  width: 500px;
  height: 400px;
  .caja1{
    position: relative;
    width: 300px;
    height: 75px;
    background: grey;
    border-radius: 5px;
    color: white;
    line-height: 75px;
    padding-left: 20px;
    font-size: 2rem;
    &::before{
      content: "";
      position: absolute;
      top: -98px;
      left: 150px;
      display: block;
      width: 0px;
      border: 50px solid transparent;
      border-bottom: 50px solid blue;
      /* border-top: 50px solid red;
      border-left: 50px solid yellow;
      border-right: 50px solid green; */

    }
    &::after {
      content: "";
      position: absolute;
      width: 0px;
      height: 0px;
      display: block;
      border: 25px solid transparent;
      bottom: -12px;
      border-radius: 50%;
       border-top: 25px solid rgb(79, 142, 179);
       top: 75px;
       left: 25px;
    }
  }
}
</style>
</head>

<body>
<header>
    <h1>PR-2-7-4: Ejemplos con efectos before y after</h1>
</header>

<h2>Ejemplo 1:</h2>
<div class="container">
  <div class="circulo"></div>
</div>

<h2>EJEMPLO 2. Cajas con triángulos de señalizació</h2>
<div class="wrapper">
  <div class="caja1">
    <a>A</a>
  </div>
</div>
</body>
</html>
