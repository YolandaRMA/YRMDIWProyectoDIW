<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2-7-3</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: serif;
        font-weight: 600;
      }
      body {
        margin: 5px;
      }
      .container {
        width: 95%;
        height: 100vh;
        background-color: #34495e;
        border: 0.5px solid transparent;
        padding: 0;
        overflow: hidden;
      }

      header {
        position: relative;
        width: 100%;
        height: 72px;
        background-color: #232f3e;
        input {
          display: none;
          &:checked ~ nav {
            left: 0;
          }
        }

        & .lblHbger {
          position: relative;
          top: 10px;
          left: 5px;
          display: block;
          background-color: #232f3e;
          width: 104px;
          height: 48px;
          margin: 0px 0px 0px 10px;
          padding-top: 10px;
          border-radius: 3px;
          &:hover {
            border: 2px solid white;
            cursor: pointer;
          }

          & span {
            display: block;
            width: 44px;
            height: 5px;
            background: white;
            margin-left: 5px;
            box-shadow:
              0px 11px 0px white,
              0px 22px 0px white;
          }
          strong {
            display: inline-block;
            position: relative;
            left: 55px;
          }
        }

        nav {
          position: absolute;
          width: 200px;
          height: 90vh;
          background: white;
          top: 0;
          left: -100%;
          transition: left 0.5s ease-in-out;

          a {
            display: block;
            width: 300%;
            height: 48px;
            color: #8a8a8a;
            border-bottom: 1px solid white;
            text-decoration: none;
            padding-left: 10px;
            line-height: 40px;
            &:hover {
              background: #ee82ee;
            }
            &:nth-of-type(1) {
              background: #232f3e;
            }
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header1">
          <img src="./images" alt="">
        </div>
        <input type="radio" name="openNav" id="openNav" />
        <input type="radio" name="rd" id="closeNav" />
        <label for="openNav" class="lblHbger">
          <span></span>
          <strong>Todo</strong>
        </label>
        <nav>
          <a href="#">Hola, identifícate</a>
          <a href="#">Tendencias</a>
          <a href="#">Los más vendidos</a>
          <a href="#">Vender en Amazon</a>
          <a href="#">Profesorado Secretaría</a>
          <a href="#">Profesorado Secretaría</a>
          <a href="#">Los más vendidos</a>
          <a href="#">Vender en Amazon</a>
        </nav>
        <label for="closeNav" class="lblClose"></label>
      </header>
    </div>
  </body>
</html>
