<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practica 1-1-2</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: sans-serif;
      }
      body {
        margin: 5px;
      }
      div{
        width: 33%;
        height: 48px;
        background-color: #00ffea;
        display: inline-block;
        text-align: center;
        font-weight: bold;
        &:nth-of-type(1){background-color: red;}
        &:nth-of-type(2){background-color: #00ff00;}
        &:nth-of-type(3){background-color: #0000ff;}
      }
      /* al ser elemento de bloque necesita in line block para poder usar height*/
      span{
        display: inline-block;
        width: 100%;
        height: 100%;
        line-height:48px ;
      &.hide{
        display: none;
      }
      span.v:hover{
        display: none;
      }
      }
    </style>
  </head>
  <body>
    <main>
        <h2>Colores RGB, al pasar el raton encima, muestra el complementario</h2>
      <div>
        <span class="v">Color rojo #FF0000 </span>
        <span class="hide">Color #00FF00 </span>
      </div>
      <div>
        <span class="v">Color verde #00FF00 </span>
        <span class="hide">Color #FF00FF </span>
      </div>
      <div>
        <span class="v">Color azul #0000FF </span>
        <span class="hide">Color #FF0000 </span>
      </div>
    </main>
  </body>
</html>
