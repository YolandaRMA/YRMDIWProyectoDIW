<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menú con subniveles utilizando (position)</title>
    <style>
        *{
            box-sizing: border-box;
            font-family: sans-serif;
            font-weight: bold;
        }
        body{margin: 5px;}
        .container{
            width: 100%;
            height: auto;
            background: rgb(240,122,195);
        }
        ul{
            list-style: none;
            
        }
        li{
            position: relative;
            height: 100%;
            width: 25%;
        }
        a{
            display: block;
            width: 100%;
            height: inherit;
            text-decoration: none;
            text-align: center;
            line-height: 52px;
            &:hover{
                background: #d2d2d2;
            }
        }
        .mnu{           
            position: relative;
            width: 100%;
            height: 52px;
            font-size: 0;
            & > li{
                display: inline-block;
                font-size: 1rem;
                background:#aebbcc ;
                border-right: 0.5px solid gray;
                &:hover >ul{

                }
            }
        }
        .sbmnu1, .sbmnu2{
            width: 100%;
            display: none;
        }
        .sbmnu1{
            position: absolute;
            top: 52px;
        }
    </style>
  </head>
  <body>
    <div class="contain">
      <!-- ul>li*4>a[href=#]{$} -->
      <ul class="mnu">
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Oficina</a></li>
        <li>
          <a href="#">Instituto&nbsp; &#x25BC; </a>
          <ul class="sbmnu1">
            <li><a href="#">Fisica-quiímica</a></li>
            <li><a href="#">Inglés</a></li>
            <li>
              <a href="#">Matemáticas</a>
              <ul>
                <li><a href="#">Académicas</a></li>
                <li><a href="#">Applicadas</a></li>
              </ul>
            </li>
          </ul>
        </li>
        <li><a href="#">Matemáticas &nbsp; &#x25BA;</a></li>
      </ul>
    </div>
  </body>
</html>
