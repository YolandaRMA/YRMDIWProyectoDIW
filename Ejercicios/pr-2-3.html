<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-weight: bold;
            font-family: serif;
            box-sizing: ;
        }
        body {
        margin: 5px;
    }
    .container{
        width: 95%;
        & nav{
            width: 400px;
            height: 300px;
            background: #000;
            padding: 10px;
            margin-bottom: 150px;
            & a{
                display: inline-block;
                width: 300px;
                height: 48px;
                text-decoration: none;
                text-align: center;
                line-height: 48px;
                background: pink;
                color: white;
                margin-bottom: 6px;
                transition: all 0.5s ease;
                &:hover{
                    background-color: #770281;
                    margin-left: 30px;
                }
            }
        } 
        /*fin de nav  */
        & section{
            width: 600px;
            height: 68px;
            background: #000;
            padding: 10px;
            & a{
               display: inline-block;
                width: 128px;
                height: 48px;
                background-color: #cd7094;
                border-radius: 6px;
                text-decoration: none;
                text-align: center; 
                line-height: 48px;
                color: green;
                &:link{
                    background: white;
                    color:#cd7094;
                }
                &:visited{background: red;}
                &:hover{font-size: 1.2rem;}
                &:active{border-radius: 1px;}
            }
        }
    }
    </style>
</head>
<body>
    <div class="container">
    <!-- nav>a[href=#]{$ opcion}*4 -->
      <nav>
        <a href="#">1 opcion</a>
        <a href="#">2 opcion</a>
        <a href="#">3 opcion</a>
        <a href="#">4 opcion</a>
    </nav>
    <section>
        <a href="https://www.educa.jcyl.es/es">EDUCACYL</a>
        <a href="https://www.marca.com/">MARCA</a>
        <a href="https://www.youtube.com">VIDEOS</a>
        <a href="https://unsplash.com/es">IMAGENES</a>
    </section>
    </div>
</body>
</html>
