<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
    
      * {
       box-sizing: border-box;
       font-family: sans-serif;
       font-size: 2rem;

      }
      body{
        margin: 10px;
      }
      main{
        width: 600px;
        height: 600px;
        background-color: gray;
        position: relative;
        top: 100px;
        left: 200px;

      }
      article:nth-of-type(n):nth-of-type(-n+4){
        position: absolute;
        padding: 5px;
      }
      article:nth-of-type(1){
        width: 325px;
        height: 370px;
        background-color: #ef476f;
        right: 0;
        z-index: 3;
      }
      article:nth-of-type(3){
        width: 325px;
        height: 400px;
        background-color: #118ab2;
        right: 0;
        bottom: 0;
        z-index: 2;
    }
      article:nth-of-type(2){
        width: 200px;
        height: 200px;
        background-color: #ffd166;
        top: 200px;
        left: 200px;
        z-index: 4;
      }
      article:nth-of-type(4){
        width: 275px;
        height: 370px;
        background-color: #8b5bd3;
        z-index: 1;
        bottom: 0;
      }
      article:nth-of-type(5){
        background-color: #06d6a0;
        width: 325px;
        height: 400px;
      }
      article:hover{
        z-index: 100;;
      }
      
    </style>
  </head>
  <body>
    <main>
      <article>1</article>
      <article>2</article>
      <article>3</article>
      <article>4</article>
      <article>5</article>
    </main>
  </body>
</html>
