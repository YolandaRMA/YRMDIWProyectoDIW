<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .container{
            /* padre con display: flex: activa flex para propiedades flex en hijos(no nietos); */
            display: flex;
            width: 600px;
            height: 300px;
            background-color: yellow;
        }
        .box{
            background-color: aqua;
            border: 1px solid black;
            width: 100px;
            height: 50px;
        }
    </style>
</head>
<body>
   <div class="container">
    <!-- .box.box$*5 -->
     <div class="box box1"></div>
     <div class="box box2"></div>
     <div class="box box3"></div>
     <div class="box box4"></div>
     <div class="box box5"></div>
   </div> 
</body>
</html>
